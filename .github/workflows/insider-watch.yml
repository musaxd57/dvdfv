name: insider-watch

on:
  schedule:
    - cron: "*/15 * * * *"   # her ~15 dakikada (GitHub gecikmeli calistirabilir)
  workflow_dispatch: {}        # elle de tetiklenebilir

permissions:
  contents: write

concurrency:
  group: insider-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run monitor pass
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python watch_once.py

      - name: Persist state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add chain_watch_state.json || true
          if git diff --cached --quiet; then
            echo "no state change"
          else
            git commit -m "update watch state [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
